[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"           # Uniswap v4 needs transient storage (TSTORE/TLOAD)
optimizer = true
optimizer_runs = 200
auto_detect_remappings = true    # let forge resolve v4's nested libs (solmate, OZ, forge-std)
ignored_error_codes = [2519, 1878]

remappings = [
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "@uniswap/permit2/=lib/permit2/",
  "v4-core/=lib/v4-core/",
  "v4-periphery/=lib/v4-periphery/",
  "permit2/=lib/permit2/",
]

fs_permissions = [
  { access = "read", path = "./lib" },
  { access = "read-write", path = "./deployments" },
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 64
depth = 64
